<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZascArr — Estado</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1c1e21;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --good: #16a34a;
    --good-bg: #dcfce7;
    --warn: #b45309;
    --warn-bg: #fef3c7;
    --bad: #dc2626;
    --bad-bg: #fee2e2;
    --neutral: #6b7280;
    --neutral-bg: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --card-bg: #232427;
      --text: #f2f3f5;
      --text-muted: #9aa0a6;
      --border: #35363a;
      --good-bg: #103a20;
      --warn-bg: #3d2e05;
      --bad-bg: #3d1414;
      --neutral-bg: #2c2d30;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 1.4rem; margin: 0 0 4px; }
  header p { margin: 0; color: var(--text-muted); font-size: 0.9rem; }

  .summary {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    flex: none;
  }
  .dot.good { background: var(--good); box-shadow: 0 0 0 6px var(--good-bg); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 0 6px var(--warn-bg); }
  .dot.bad  { background: var(--bad);  box-shadow: 0 0 0 6px var(--bad-bg); }
  .dot.neutral { background: var(--neutral); box-shadow: 0 0 0 6px var(--neutral-bg); }

  .summary-text .label { font-size: 1.15rem; font-weight: 600; }
  .summary-text .detail { color: var(--text-muted); font-size: 0.85rem; margin-top: 2px; }

  .checks {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .check-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }
  .check-row:last-child { border-bottom: none; }
  .check-dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .check-dot.good { background: var(--good); }
  .check-dot.warn { background: var(--warn); }
  .check-dot.bad  { background: var(--bad); }
  .check-dot.neutral { background: var(--neutral); }
  .check-name { flex: 1; font-weight: 500; }
  .check-status { color: var(--text-muted); font-size: 0.9rem; }

  .warnings {
    background: var(--warn-bg);
    border: 1px solid var(--warn);
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 18px;
    display: none;
  }
  .warnings.visible { display: block; }
  .warnings .title { font-weight: 600; margin-bottom: 6px; color: var(--warn); }
  .warnings ul { margin: 0; padding-left: 18px; }
  .warnings li { margin-bottom: 4px; }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.78rem;
  }

  /* Migas de pan (bug real reportado: esta página no tenía forma de volver
     — es un fichero estático fuera de base.html/topnav a propósito, ver
     docstring de dashboard() en main.py, así que la navegación se repite
     aquí a mano en vez de heredarla). */
  .volver {
    display: block;
    text-align: center;
    margin-bottom: 14px;
    font-size: 0.9rem;
  }
  .volver a { color: var(--text-muted); text-decoration: none; }
  .volver a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="wrap">
    <nav class="volver"><a href="/ui/">← Volver a la biblioteca</a></nav>
    <header>
      <h1>ZascArr</h1>
      <p>Estado del sistema</p>
    </header>

    <div class="summary">
      <div id="summary-dot" class="dot neutral"></div>
      <div class="summary-text">
        <div id="summary-label" class="label">Comprobando…</div>
        <div id="summary-detail" class="detail"></div>
      </div>
    </div>

    <div id="warnings" class="warnings">
      <div class="title">Avisos</div>
      <ul id="warnings-list"></ul>
    </div>

    <div class="checks" id="checks"></div>

    <footer id="footer">—</footer>
  </div>

<script>
  const POLL_INTERVAL_MS = 10000;

  const CHECK_LABELS = {
    database: "Base de datos",
    transmission: "Transmission",
    amule: "aMule",
    vpn: "VPN",
  };

  // Texto legible por comprobación + valor crudo del backend.
  const CHECK_TEXT = {
    database:     { ok: "Conectada",  error: "Sin conexión" },
    transmission: { ok: "Conectado",  unreachable: "No disponible" },
    amule:        { ok: "Conectado",  unreachable: "No disponible" },
    vpn:          { ok: "Activa", warning: "Sin proteger", unknown: "Sin datos" },
  };

  const CHECK_LEVEL = {
    ok: "good", error: "bad", unreachable: "bad",
    warning: "warn", unknown: "warn",
  };

  const SUMMARY_META = {
    healthy:      { level: "good", label: "Todo bien" },
    degraded:     { level: "warn", label: "Atención" },
    unhealthy:    { level: "bad",  label: "Error" },
    unreachable:  { level: "neutral", label: "Sin conexión con el servidor" },
  };

  function renderHealth(data) {
    const meta = SUMMARY_META[data && data.status] || SUMMARY_META.unreachable;
    document.getElementById("summary-dot").className = "dot " + meta.level;
    document.getElementById("summary-label").textContent = meta.label;

    const checksEl = document.getElementById("checks");
    checksEl.innerHTML = "";
    const checks = (data && data.checks) || {};
    const detailParts = [];

    for (const key of Object.keys(CHECK_LABELS)) {
      const raw = checks[key];
      const level = CHECK_LEVEL[raw] || "neutral";
      const text = (CHECK_TEXT[key] && CHECK_TEXT[key][raw]) || "Sin datos";
      if (level !== "good") detailParts.push(CHECK_LABELS[key]);

      const row = document.createElement("div");
      row.className = "check-row";
      row.innerHTML =
        '<div class="check-dot ' + level + '"></div>' +
        '<div class="check-name">' + CHECK_LABELS[key] + "</div>" +
        '<div class="check-status">' + text + "</div>";
      checksEl.appendChild(row);
    }

    document.getElementById("summary-detail").textContent =
      meta.level === "good" ? "" : detailParts.join(", ");

    const warnings = (data && data.warnings) || {};
    const warningMessages = Object.values(warnings);
    const warningsEl = document.getElementById("warnings");
    const warningsList = document.getElementById("warnings-list");
    warningsList.innerHTML = "";
    if (warningMessages.length) {
      warningMessages.forEach((msg) => {
        const li = document.createElement("li");
        li.textContent = msg;
        warningsList.appendChild(li);
      });
      warningsEl.classList.add("visible");
    } else {
      warningsEl.classList.remove("visible");
    }

    const footer = document.getElementById("footer");
    const version = data && data.version ? "v" + data.version + " · " : "";
    footer.textContent = version + "Última comprobación: " + new Date().toLocaleTimeString("es-ES");
  }

  async function poll() {
    try {
      const res = await fetch("/api/health", { cache: "no-store" });
      const data = await res.json();
      renderHealth(data);
    } catch (err) {
      renderHealth({ status: "unreachable" });
    }
  }

  poll();
  setInterval(poll, POLL_INTERVAL_MS);
</script>
</body>
</html>
