{% if not series_list %}
<p class="no-results">Sin coincidencias.</p>
{% else %}
<ul class="series-list">
  {% for s in series_list %}
  <li class="series-result-item">
    <span class="series-name">{{ s.title }}{% if s.start_year %} ({{ s.start_year }}){% endif %}</span>
    <button type="button"
            hx-post="/ui/wishlist/anadir"
            hx-vals='{"series_id": "{{ s.id }}"}'
            hx-swap="none"
            hx-disabled-elt="this"
            hx-on::before-request="this.textContent='Añadiendo…'"
            hx-on::after-request="this.textContent='Añadido'; setTimeout(() => window.location.reload(), 400)">
      Añadir a deseados
    </button>
  </li>
  {% endfor %}
</ul>
{% endif %}
