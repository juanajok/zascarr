{% if not series_list %}
<p class="no-results">Sin coincidencias.</p>
{% else %}
<ul class="series-list">
  {% for s in series_list %}
  <li class="series-result-item">
    {% set referencia = s.reference_name or s.title %}
    <span class="series-name">{{ referencia }}</span>
    <button type="button"
            hx-post="/ui/wishlist/anadir"
            hx-vals='{"series_id": "{{ s.id }}"}'
            hx-target="#wishlist-list" hx-swap="beforeend"
            hx-disable="this"
            hx-on::before-request="this.querySelector('[data-texto]').textContent='Añadiendo…'"
            hx-on::after-request="if (event.detail.successful) { this.querySelector('[data-texto]').textContent='Añadido'; this.disabled = true; } else { this.querySelector('[data-texto]').textContent='No se pudo añadir'; this.disabled = false; }">
      <span data-texto>Añadir a deseados</span><span class="sr">: {{ referencia }}</span>
    </button>
  </li>
  {% endfor %}
</ul>
{% endif %}
