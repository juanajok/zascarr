<section id="colecciones-serie" class="series-colecciones" aria-label="Colecciones">
  <h2 id="colecciones-serie-titulo" class="titulo-frase">Colecciones</h2>
  {% if colecciones %}
  <p class="series-colecciones-lista">
    {% for c in colecciones %}
    <a class="chip chip-enlace" href="/ui/colecciones/{{ c.id }}">{{ c.name }}</a>
    {% endfor %}
  </p>
  {% else %}
  <p class="muted">Esta serie no está en ninguna colección.</p>
  {% endif %}
</section>
