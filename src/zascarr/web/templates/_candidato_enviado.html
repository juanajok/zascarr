<div class="wishlist-estado" id="estado-fila-{{ row.item.id }}"
     hx-swap-oob="outerHTML:#estado-fila-{{ row.item.id }}">
  {% include "_estado_wishlist.html" %}
</div>
<li class="candidato-fila{% if exito %} candidato-enviado{% endif %}"
    id="candidato-{{ item_id }}-{{ indice }}">
  <span class="candidato-titulo">{{ titulo }}</span>
  {% if exito %}
  <span class="candidato-detalle"><strong>Enviado</strong> a la cola de descarga</span>
  {% else %}
  <span class="candidato-detalle">{{ row.motivo or "No se pudo enviar la descarga" }}</span>
  <form hx-post="/ui/wishlist/{{ item_id }}/enviar-candidato"
        hx-target="closest li" hx-swap="outerHTML"
        hx-confirm="¿Descargar este candidato?">
    <input type="hidden" name="token" value="{{ token }}">
    <input type="hidden" name="indice" value="{{ indice }}">
    <button type="submit" class="btn-descargar-candidato" hx-disable="this"
            aria-label="Reintentar la descarga de {{ titulo }}">Descargar este</button>
  </form>
  {% endif %}
</li>
