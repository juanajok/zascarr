<li class="discovery-card">
  <img class="cover" alt="" src="/ui/series/{{ series.id }}/portada"
       onerror="this.classList.add('cover-missing')">
  <div class="discovery-card-body">
    <div class="discovery-card-title">
      {{ series.title }}{% if series.start_year %} ({{ series.start_year }}){% endif %}
      <span class="caption">{{ "ya estaba en tu biblioteca" if not creada else "creada" }}</span>
    </div>
    <div class="discovery-card-actions">
      <a class="btn" href="/ui/series/{{ series.id }}">Ver ficha</a>
      <button type="button"
              hx-post="/ui/wishlist/anadir"
              hx-vals='{"series_id": "{{ series.id }}"}'
              hx-swap="none"
              hx-disabled-elt="this"
              hx-on::before-request="this.textContent='Añadiendo…'"
              hx-on::after-request="this.textContent='Añadida a deseados'">
        Añadir a deseados
      </button>
    </div>
  </div>
</li>
