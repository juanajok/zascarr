<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ZascArr{% endblock %}</title>
<link rel="stylesheet" href="/static/web.css">
<link rel="icon" href="/static/brand/zascarr-favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/brand/zascarr-favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/brand/apple-touch-icon.png">
<script src="/static/vendor/htmx.min.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <div class="app">
    <div class="side">
      <a href="/ui/" class="brand">ZascArr</a>
      {{ ui.menu(request.url.path) }}
      {% if auth_activo() %}
      <div class="side-foot">
        <form method="post" action="/logout" class="nav-logout">
          <button type="submit" class="btn-logout">Cerrar sesión</button>
        </form>
      </div>
      {% endif %}
    </div>
    <main class="content" id="main" tabindex="-1" hx-history-elt>
    <div class="tareas-fuera">
      <div id="tareas-global">
        <div id="tareas-hay" hidden></div>
        <details id="tareas-detalles" class="tareas-panel">
          <summary hx-post="/ui/_tareas/visto" hx-trigger="click[!this.parentElement.open]"
                   hx-target="#tareas-global" hx-swap="none"><span id="tareas-contador" class="tareas-chip">Ahora</span>
            <span id="tareas-nombre" class="tareas-nombre"></span></summary>
          <div id="tareas-lista" class="tareas-lista"></div>
        </details>
        <div id="tareas-anuncio" class="tareas-anuncio sr" role="status" aria-live="polite"></div>
        <div id="tareas-cadencia" hx-get="/ui/_tareas" hx-trigger="load, every 10s"
             hx-swap="none"></div>
      </div>
    </div>
      {% block content %}{% endblock %}
      <footer class="site-footer">
        {% from "_legal_disclaimer.html" import legal_disclaimer %}
        {{ legal_disclaimer("footer") }}
      </footer>
    </main>
  </div>
</body>
</html>
