<div id="control-vista" class="barra-vista barra-vista-grupo" role="group" aria-label="Vista de la biblioteca"
     {% if oob %}hx-swap-oob="true"{% endif %}>
  <a class="barra-vista-opcion{% if filtros.vista != 'lista' %} barra-vista-opcion-actual{% endif %}"
     href="{{ url_vista_tarjetas }}"
     hx-get="{{ url_vista_tarjetas_fragmento }}"
     hx-target="#rejilla" hx-swap="innerHTML"
     {% if filtros.vista != 'lista' %}aria-current="page"{% endif %}
     aria-label="Tarjetas" title="Vista de tarjetas">
    <span class="barra-vista-icono" aria-hidden="true">{{ icono("grid") }}</span>
    <span class="barra-vista-texto">Tarjetas</span>
  </a>
  <a class="barra-vista-opcion{% if filtros.vista == 'lista' %} barra-vista-opcion-actual{% endif %}"
     href="{{ url_vista_lista }}"
     hx-get="{{ url_vista_lista_fragmento }}"
     hx-target="#rejilla" hx-swap="innerHTML"
     {% if filtros.vista == 'lista' %}aria-current="page"{% endif %}
     aria-label="Lista" title="Vista de lista">
    <span class="barra-vista-icono" aria-hidden="true">{{ icono("list") }}</span>
    <span class="barra-vista-texto">Lista</span>
  </a>
</div>
