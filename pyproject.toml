[project]
name = "zascarr"
version = "1.2.5"
description = "Orquestador inteligente de tebeoteca digital para Raspberry Pi"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.0",
    "arq>=0.26.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "lxml>=5.2.0",
    "pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
    "jinja2>=3.1.0",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Sin esto, `pip install .` (no editable, el que usa el Dockerfile) no
# empaqueta plantillas/estáticos: setuptools solo incluye .py por defecto.
# Un `pip install -e .` en local lo esconde porque lee directo del working
# tree, así que este bug solo se vería dentro del contenedor construido
# (ya nos pasó una vez con dashboard.html — ver commit de E1).
[tool.setuptools.package-data]
zascarr = ["static/*.html", "static/*.css", "static/vendor/*.js", "web/templates/*.html", "LEGAL.md"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
# B008: Depends(...) en la firma es el patrón obligatorio de FastAPI, no un
# antipatrón real — falso positivo conocido, no un "no hacer nunca" genérico.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
