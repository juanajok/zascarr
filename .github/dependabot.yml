version: 2
# Las dependencias de Python se actualizan a mano con `uv pip compile` para
# conservar los hashes de `requirements-runtime.txt` (ver README). Dependabot
# solo mantiene las acciones de GitHub, que no tienen lockfile propio.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
