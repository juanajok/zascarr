name: CI

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la ejecución anterior; en `main` no se
# cancela nada para no perder la señal de una release.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
  # Sin `branches: [main]`: un PR apilado (base = otra rama, como la ficha de un
  # lote) también tiene que correr la suite, no solo los que van contra `main`.
  pull_request:

jobs:
  test:
    name: Suite unitaria
    # #530 R4: imagen fijada (26.04) con unar/lsar 1.10.8; `ubuntu-latest` podría cambiar. El gate
    # de versión de más abajo sigue fallando alto si la imagen no trae 1.10.8, así que no pasa inadvertido.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Un `.tmp-*` o un log versionado no debe llegar a una release: son artefactos de
      # ejecución locales, no documentación ni fixtures. El `.gitignore` evita el descuido;
      # este gate se asegura de que no se fuerza con `git add -f`.
      - name: Higiene del repositorio (sin artefactos locales)
        run: |
          sobrantes="$(git ls-files -- '.tmp-*' '*.log' '*.dump' '*.prof')"
          if [ -n "$sobrantes" ]; then
            echo "::error::artefactos locales versionados:"
            echo "$sobrantes"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra dev
      # #418: `unar` (con `lsar`) para las pruebas con RAR REAL: sin él se SALTAN, y una prueba saltada no es una pasada.
      - name: unar para las pruebas de RAR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends unar
      # #530 C3: la suite debe correr con el MISMO 1.10.8 y el flag; el fallback no puede convertir
      # en verde un runner antiguo (1.10.1 no conocería el flag).
      - name: unar/lsar 1.10.8 y flag en el runner de la suite
        run: |
          for b in unar lsar; do
            v="$($b -v)"; echo "$b: $v"
            case "$v" in *"1.10.8"*) ;; *) echo "::error::$b no es 1.10.8 ($v)"; exit 1;; esac
          done
          lsar --help 2>&1 | grep -q -- "-json-skip-solid-information" || { echo "::error::lsar no conoce el flag del listado de sólidos"; exit 1; }
      # Las pruebas de credenciales (ADR 0012) usan Docker real: el servicio `credenciales` de Compose necesita la imagen
      # de PostgreSQL ya descargada, y los guiones de tests/escenarios/ corren como root en este ejecutor desechable
      # (CI=true + sudo sin clave) con usuarios sintéticos. Sin esto se SALTAN, y una prueba saltada no es una pasada.
      - name: Imagen de PostgreSQL para las pruebas de Compose
        run: docker pull -q postgres:15-alpine
      - run: uv run --locked pytest -q -rs --junitxml=suite.xml
      # #418: ninguna prueba marcada `rar_real` puede haberse saltado (mismo patrón que `ci_postgres.py`).
      - name: Exigir que las pruebas de RAR real se ejecutaron
        run: uv run --locked python scripts/ci_rar_real.py suite.xml

  test-314:
    name: Suite unitaria (Python 3.14)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Higiene del repositorio (sin artefactos locales)
        run: |
          sobrantes="$(git ls-files -- '.tmp-*' '*.log' '*.dump' '*.prof')"
          if [ -n "$sobrantes" ]; then
            echo "::error::artefactos locales versionados:"
            echo "$sobrantes"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - name: unar para las pruebas de RAR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends unar
      - name: unar/lsar 1.10.8 y flag en el runner de la suite
        run: |
          for b in unar lsar; do
            v="$($b -v)"; echo "$b: $v"
            case "$v" in *"1.10.8"*) ;; *) echo "::error::$b no es 1.10.8 ($v)"; exit 1;; esac
          done
          lsar --help 2>&1 | grep -q -- "-json-skip-solid-information" || { echo "::error::lsar no conoce el flag del listado de sólidos"; exit 1; }
      - name: Imagen de PostgreSQL para las pruebas de Compose
        run: docker pull -q postgres:15-alpine
      - run: uv run --locked pytest -q -rs --junitxml=suite314.xml
      - name: Exigir que las pruebas de RAR real se ejecutaron
        run: uv run --locked python scripts/ci_rar_real.py suite314.xml

  postgres:
    name: Pruebas con Postgres real
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Base de datos NUEVA y dedicada a este job (la misma imagen que el docker-compose del proyecto).
    # Las pruebas de Postgres se saltan solas sin TEST_DATABASE_URL: este job existe para que NO se
    # salten, y `scripts/ci_postgres.py` falla si no se ejecutaron de verdad.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: zascarr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d zascarr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/zascarr_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra dev
      # #344: las pruebas de RAR REAL (extracción de paquetes) necesitan unar/lsar; sin ellas se saltan
      # y `ci_postgres.py` falla porque el job no acredita haber ejecutado todas las de Postgres.
      - name: unar para las pruebas de RAR real
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends unar
      # #334: las pruebas de restauración vuelcan y restauran con los clientes del RUNNER contra el servidor de arriba
      # (PostgreSQL 15, como docker-compose.yml). Con `ubuntu-latest` en 26.04 el cliente era de la serie 18 y su
      # `pg_dump` escribe `SET transaction_timeout`, que un servidor 15 rechaza. Se instala el cliente 15 (PGDG) y se
      # pone el primero en el PATH; el último paso falla alto si no es el 15, en vez de dejar un rojo difícil de leer.
      - name: Cliente de PostgreSQL 15 (el mismo mayor que el servidor)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-15
          echo "/usr/lib/postgresql/15/bin" >> "$GITHUB_PATH"
      - name: Comprobar que los clientes de PostgreSQL son los del servidor (15)
        run: |
          for c in psql pg_dump createdb dropdb; do
            v="$($c --version)"; echo "$c: $v"
            case "$v" in *" 15."*) ;; *) echo "::error::$c no es de PostgreSQL 15 ($v)"; exit 1 ;; esac
          done
      - name: Comprobar que Postgres contesta y la variable está definida
        run: uv run --locked python scripts/ci_postgres.py esperar
      - name: Pruebas que usan Postgres real
        run: |
          uv run --locked pytest -q -rs --junitxml=pg.xml $(grep -l TEST_DATABASE_URL tests/*.py | grep -v conftest | sort)
      - name: Exigir que se ejecutaron (ninguna saltada, ninguna con fallo)
        if: always()
        run: uv run --locked python scripts/ci_postgres.py junit pg.xml

  lint:
    # 2026-11-13 (#211): el lint está en 0 en `src/` y en `--select S`, así que
    # deja de ser informativo. Un fallo nuevo del lint bloquea como la suite.
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.13.9"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check src/
      # Reglas de seguridad de bandit (S). `if: always()` para que las dos
      # comprobaciones se ejecuten aunque la primera falle y se vea el detalle.
      - run: uv run --locked ruff check --select S src/
        if: always()
      # V14 (#750): ninguna clase usada puede quedarse sin regla y no debe quedar CSS muerto.
      - run: uv run --locked python scripts/auditar_css.py --strict

  docker-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            name: Build de la imagen Docker
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            name: Build de la imagen Docker ARM64
    steps:
      - uses: actions/checkout@v7
      # #530 R3: centinela de contexto. Si `.dockerignore` dejara de excluir `.env`, el build metería
      # este fichero en la imagen y el paso de verificación de abajo fallaría.
      - name: centinela .env para el contexto (#530 R3)
        run: |
          printf 'ZASCARR_CENTINELA=no-debe-entrar-en-la-imagen\n' > .env
          mkdir -p artefactos-locales
          touch artefactos-locales/centinela
      - name: Construir la imagen de la plataforma
        run: |
          docker build --platform "${{ matrix.platform }}" -t zascarr:ci .
          test "$(docker image inspect zascarr:ci --format '{{.Os}}/{{.Architecture}}')" = "${{ matrix.platform }}"
      - run: docker run --rm --entrypoint python zascarr:ci -m pip check
      # #530 R3: el centinela NO puede estar en /app; `.env.example` sí (no tiene valores).
      - name: el centinela .env no entra en la imagen (#530 R3)
        run: |
          docker run --rm --entrypoint sh zascarr:ci -c 'test ! -e /app/.env' || \
            { echo "::error::/app/.env entró en la imagen (¿se perdió el .dockerignore?)"; exit 1; }
          docker run --rm --entrypoint sh zascarr:ci -c 'test -e /app/.env.example' || \
            { echo "::error::/app/.env.example no está en la imagen"; exit 1; }
          docker run --rm --entrypoint sh zascarr:ci -c 'test ! -e /app/artefactos-locales'
          echo "Artefactos locales y .env ausentes. .env.example presente en /app"
      # #528: la base trixie trae `unar`/`lsar` 1.10.8 y el flag que evita que un sólido grande repita
      # ~29 KB por entrada y reviente el tope de salida. Se comprueba VERSIÓN y FLAG en la imagen final.
      - name: unar/lsar 1.10.8 y el flag del listado de sólidos
        run: |
          docker run --rm --entrypoint runuser zascarr:ci -u zascarr -- sh -c '
            unar -v | grep -q "1\.10\.8" || { echo "::error::unar no es 1.10.8 ($(unar -v))"; exit 1; }
            lsar -v | grep -q "1\.10\.8" || { echo "::error::lsar no es 1.10.8 ($(lsar -v))"; exit 1; }
            lsar --help 2>&1 | grep -q -- "-json-skip-solid-information" || \
              { echo "::error::lsar no conoce -json-skip-solid-information"; exit 1; }'
      # #418 (ADR 0015): sin los demonios GNUstep que nadie usa, y `lsar` sigue leyendo un RAR de verdad.
      - name: sin gdomap/gdnc/gpbs ni sus ficheros de servicio y con lsar funcionando sobre RAR (incluido sólido)
        run: |
          docker run --rm -v "$PWD/tests:/app/tests:ro" --entrypoint sh zascarr:ci -c '
            for b in "gdomap*" gdnc "gpbs*"; do
              if [ -n "$(find / -xdev -type f -name "$b" 2>/dev/null)" ]; then echo "::error::$b sigue en la imagen"; exit 1; fi
            done
            runuser -u zascarr -- lsar -j -json-skip-solid-information /app/tests/fixtures/rar/minimo_rar5.cbr | grep -q "01.jpg"
            runuser -u zascarr -- lsar -j -json-skip-solid-information /app/tests/fixtures/rar/solido_rar4.cbr | grep -q "01.jpg"
            echo "setuid/setgid de la imagen:"; find / -xdev -perm /6000 -type f 2>/dev/null | head -20'
      # #418 (SecOps C-4): la suite y la imagen usan ya el mismo `unar` 1.10.8 (trixie desde #528).
      - name: lector RAR con el unar de la imagen de producción (ejecutables de GNUstep fuera, sin setuid nuevo, fixtures)
        run: docker run --rm -v "$PWD/tests:/app/tests:ro" --entrypoint runuser zascarr:ci -u zascarr -- python /app/scripts/comprobar_imagen_rar.py
      - name: presupuesto de tamaño de la imagen (#530 C2)
        run: |
          bytes=$(docker image inspect zascarr:ci --format '{{.Size}}')
          mib=$((bytes / 1048576))
          echo "imagen: ${mib} MiB (presupuesto: 750 MiB)"
          if [ "$mib" -gt 750 ]; then
            echo "::error::la imagen mide ${mib} MiB y supera el presupuesto de 750 MiB"
            exit 1
          fi
      - name: Arranque, migración y recuperación con PostgreSQL 15
        run: bash scripts/ci_arranque_imagen.sh zascarr:ci
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Obtener las dependencias instaladas en la imagen
        run: |
          id=$(docker create zascarr:ci)
          trap 'docker rm "$id" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/zascarr-site-packages"
          docker cp "$id:/usr/local/lib/python3.11/site-packages/." "$RUNNER_TEMP/zascarr-site-packages"
      - name: Auditar dependencias de la imagen (informativo)
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit --path "$RUNNER_TEMP/zascarr-site-packages" --skip-editable
      # #530 R3: limpiar el centinela aunque algo haya fallado antes.
      - name: limpiar el centinela .env (#530 R3)
        if: always()
        run: rm -f .env artefactos-locales/centinela
