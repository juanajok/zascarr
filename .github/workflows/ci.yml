name: CI

on:
  push:
    branches: [main]
  # Sin `branches: [main]`: un PR apilado (base = otra rama, como la ficha de un
  # lote) también tiene que correr la suite, no solo los que van contra `main`.
  pull_request:

jobs:
  test:
    name: Suite unitaria
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      # #418: `unar` (con `lsar`) para las pruebas con RAR REAL: sin él se SALTAN, y una prueba saltada no es una pasada.
      - name: unar para las pruebas de RAR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends unar
      # #530 C3: la suite debe correr con el MISMO 1.10.8 y el flag; el fallback no puede convertir
      # en verde un runner antiguo (1.10.1 no conocería el flag).
      - name: unar/lsar 1.10.8 y flag en el runner de la suite
        run: |
          for b in unar lsar; do
            v="$($b -v)"; echo "$b: $v"
            case "$v" in *"1.10.8"*) ;; *) echo "::error::$b no es 1.10.8 ($v)"; exit 1;; esac
          done
          lsar --help 2>&1 | grep -q -- "-json-skip-solid-information" || { echo "::error::lsar no conoce el flag del listado de sólidos"; exit 1; }
      # Las pruebas de credenciales (ADR 0012) usan Docker real: el servicio `credenciales` de Compose necesita la imagen
      # de PostgreSQL ya descargada, y los guiones de tests/escenarios/ corren como root en este ejecutor desechable
      # (CI=true + sudo sin clave) con usuarios sintéticos. Sin esto se SALTAN, y una prueba saltada no es una pasada.
      - name: Imagen de PostgreSQL para las pruebas de Compose
        run: docker pull -q postgres:15-alpine
      - run: pytest -q -rs --junitxml=suite.xml
      # #418: ninguna prueba marcada `rar_real` puede haberse saltado (mismo patrón que `ci_postgres.py`).
      - name: Exigir que las pruebas de RAR real se ejecutaron
        run: python scripts/ci_rar_real.py suite.xml

  postgres:
    name: Pruebas con Postgres real
    runs-on: ubuntu-latest
    # Base de datos NUEVA y dedicada a este job (la misma imagen que el docker-compose del proyecto).
    # Las pruebas de Postgres se saltan solas sin TEST_DATABASE_URL: este job existe para que NO se
    # salten, y `scripts/ci_postgres.py` falla si no se ejecutaron de verdad.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: zascarr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d zascarr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/zascarr_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      # #334: las pruebas de restauración vuelcan y restauran con los clientes del RUNNER contra el servidor de arriba
      # (PostgreSQL 15, como docker-compose.yml). Con `ubuntu-latest` en 26.04 el cliente era de la serie 18 y su
      # `pg_dump` escribe `SET transaction_timeout`, que un servidor 15 rechaza. Se instala el cliente 15 (PGDG) y se
      # pone el primero en el PATH; el último paso falla alto si no es el 15, en vez de dejar un rojo difícil de leer.
      - name: Cliente de PostgreSQL 15 (el mismo mayor que el servidor)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-15
          echo "/usr/lib/postgresql/15/bin" >> "$GITHUB_PATH"
      - name: Comprobar que los clientes de PostgreSQL son los del servidor (15)
        run: |
          for c in psql pg_dump createdb dropdb; do
            v="$($c --version)"; echo "$c: $v"
            case "$v" in *" 15."*) ;; *) echo "::error::$c no es de PostgreSQL 15 ($v)"; exit 1 ;; esac
          done
      - name: Comprobar que Postgres contesta y la variable está definida
        run: python scripts/ci_postgres.py esperar
      - name: Pruebas que usan Postgres real
        run: |
          pytest -q -rs --junitxml=pg.xml $(grep -l TEST_DATABASE_URL tests/*.py | grep -v conftest | sort)
      - name: Exigir que se ejecutaron (ninguna saltada, ninguna con fallo)
        if: always()
        run: python scripts/ci_postgres.py junit pg.xml

  lint:
    name: ruff (informativo, no bloquea)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: ruff check src/
      # Reglas de seguridad de bandit (S), también informativas. `if: always()`
      # porque el paso anterior ya falla hoy por errores preexistentes y, sin
      # esto, GitHub saltaría este paso.
      - run: ruff check --select S src/
        if: always()

  pip-audit:
    name: pip-audit (informativo, no bloquea)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      # El setuptools del runner (79.0.1) arrastra PYSEC-2026-3447, que es solo de
      # build (bypass de MANIFEST.in al construir un sdist en macOS/APFS) y no
      # aplica a ZascArr; se sube para que la señal de pip-audit siga siendo útil.
      - run: pip install --upgrade "setuptools>=83"
      # Se instala SOLO en CI: no es dependencia de la aplicación (Ni RAM ni
      # superficie en la Pi). Señal real de CVEs en dependencias; antes no había
      # ningún análisis de este tipo (NFR-17).
      - run: pip install pip-audit
      - run: pip-audit

  docker-build:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t zascarr:ci .
      # #528: la base trixie trae `unar`/`lsar` 1.10.8 y el flag que evita que un sólido grande repita
      # ~29 KB por entrada y reviente el tope de salida. Se comprueba VERSIÓN y FLAG en la imagen final.
      - name: unar/lsar 1.10.8 y el flag del listado de sólidos
        run: |
          docker run --rm --entrypoint runuser zascarr:ci -u zascarr -- sh -c '
            unar -v | grep -q "1\.10\.8" || { echo "::error::unar no es 1.10.8 ($(unar -v))"; exit 1; }
            lsar -v | grep -q "1\.10\.8" || { echo "::error::lsar no es 1.10.8 ($(lsar -v))"; exit 1; }
            lsar --help 2>&1 | grep -q -- "-json-skip-solid-information" || \
              { echo "::error::lsar no conoce -json-skip-solid-information"; exit 1; }'
      # #418 (ADR 0015): sin los demonios GNUstep que nadie usa, y `lsar` sigue leyendo un RAR de verdad.
      - name: sin gdomap/gdnc/gpbs ni sus ficheros de servicio y con lsar funcionando sobre RAR (incluido sólido)
        run: |
          docker run --rm --entrypoint sh zascarr:ci -c '
            for b in "gdomap*" gdnc "gpbs*"; do
              if [ -n "$(find / -xdev -type f -name "$b" 2>/dev/null)" ]; then echo "::error::$b sigue en la imagen"; exit 1; fi
            done
            runuser -u zascarr -- lsar -j -json-skip-solid-information /app/tests/fixtures/rar/minimo_rar5.cbr | grep -q "01.jpg"
            runuser -u zascarr -- lsar -j -json-skip-solid-information /app/tests/fixtures/rar/solido_rar4.cbr | grep -q "01.jpg"
            echo "setuid/setgid de la imagen:"; find / -xdev -perm /6000 -type f 2>/dev/null | head -20'
      # #418 (SecOps C-4): la suite y la imagen usan ya el mismo `unar` 1.10.8 (trixie desde #528).
      - name: lector RAR con el unar de la imagen de producción (ejecutables de GNUstep fuera, sin setuid nuevo, fixtures)
        run: docker run --rm --entrypoint runuser zascarr:ci -u zascarr -- python /app/scripts/comprobar_imagen_rar.py
      - name: presupuesto de tamaño de la imagen (#530 C2)
        run: |
          bytes=$(docker image inspect zascarr:ci --format '{{.Size}}')
          mib=$((bytes / 1048576))
          echo "imagen: ${mib} MiB (presupuesto: 750 MiB)"
          if [ "$mib" -gt 750 ]; then
            echo "::error::la imagen mide ${mib} MiB y supera el presupuesto de 750 MiB"
            exit 1
          fi
      - name: arranque con la imagen endurecida
        run: |
          docker run --rm --security-opt no-new-privileges:true --pids-limit 256 --entrypoint runuser zascarr:ci \
            -u zascarr -- python -c "import zascarr.main"
