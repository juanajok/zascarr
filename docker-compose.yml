# docker-compose.yml — ZascArr
#
# Uso:
#   cd /path/a/zascarr   # raíz del repo
#   cp .env.example .env
#   docker compose up -d
#
# Código en ZASCARR_ROOT (p.ej. /opt/zascarr), datos de los contenedores en
# ZASCARR_DATA_DIR (por defecto /var/lib/zascarr) — separados a propósito,
# mismo patrón que el resto de la suite *arr (código en /opt, datos en
# /var/lib). Los discos del usuario (biblioteca/descargas) se pasan por
# .env (HOST_*_DIR).

name: zascarr

networks:
  zascarr-internal:
    driver: bridge

services:
  # Credenciales: servicio de UN solo uso (corre, comprueba y termina; no deja nada en memoria). PostgreSQL y la
  # aplicación esperan a que termine bien (`service_completed_successfully`), así que con DB_PASSWORD ausente, vacía
  # o de ejemplo ningún `docker compose up` crea la base ni arranca la app — sea cual sea la ruta (bootstrap.sh, a
  # mano, `run`). `${VAR:?}` solo cubriría «ausente/vacía» y, además, haría fallar `docker compose down/logs/ps`
  # cuando falta el .env (justo cuando se quiere parar o desinstalar); aquí el rechazo ocurre al ARRANCAR.
  # La lista es la de scripts/_credenciales.sh y zascarr/utils/credenciales.py (la prueba test_credenciales_lista.py
  # comprueba que coinciden). Reutiliza la imagen de PostgreSQL: no se descarga nada nuevo. Sin red, sin escribir.
  credenciales:
    image: postgres:15-alpine
    restart: "no"
    network_mode: none
    read_only: true
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-}
    entrypoint:
      - sh
      - -c
      - |
        v=$$(printf '%s' "$$DB_PASSWORD" | tr -d ' \t\r\n"'"'"'' | tr 'A-Z' 'a-z')
        case "$$v" in
          ""|cambia_esto_ahora|supersecretpassword123|changeme)
            echo "ZascArr no arranca: DB_PASSWORD falta, está vacía o conserva un valor de ejemplo." >&2
            echo "Ejecuta: sudo bash scripts/credenciales.sh   (crea una contraseña propia y no la muestra)" >&2
            exit 1 ;;
        esac
    deploy:
      resources:
        limits:
          memory: 16M

  postgres:
    image: postgres:15-alpine
    container_name: zascarr-db
    restart: unless-stopped
    networks:
      - zascarr-internal
    environment:
      POSTGRES_USER: comics_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_DB: zascarr
    command:
      - -c
      - listen_addresses=*
      - -c
      - max_connections=50
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${ZASCARR_DATA_DIR:-/var/lib/zascarr}/postgres:/var/lib/postgresql/data
    depends_on:
      credenciales:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comics_admin -d zascarr"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  zascarr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zascarr-orquestador
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - zascarr-internal
    ports:
      # A11: dirección en la que el HOST publica la interfaz. Por defecto solo esta
      # máquina (ADR 0004); `bootstrap.sh` la cambia a 0.0.0.0 si eliges «mi red
      # local», y solo tras fijar una contraseña. Postgres NO se
      # parametrizan: nunca deben ser alcanzables desde la red.
      - "${ZASCARR_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://comics_admin:${DB_PASSWORD:-}@postgres:5432/zascarr
      - COMICVINE_API_KEY=${COMICVINE_API_KEY:-}
      - PROWLARR_URL=${PROWLARR_URL:-http://host.docker.internal:9696}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY:-}
      - TRANSMISSION_URL=${TRANSMISSION_URL:-http://host.docker.internal:9091}
      - TRANSMISSION_USERNAME=${TRANSMISSION_USERNAME:-}
      - TRANSMISSION_PASSWORD=${TRANSMISSION_PASSWORD:-}
      - AMULE_URL=${AMULE_URL:-http://host.docker.internal:4711}
      - AMULE_PASSWORD=${AMULE_PASSWORD:-}
      - FORUM_ENABLED=${FORUM_ENABLED:-false}
      - FORUM_URL=${FORUM_URL:-}
      - FORUM_USERNAME=${FORUM_USERNAME:-}
      - FORUM_PASSWORD=${FORUM_PASSWORD:-}
      - LIBRARY_PATH=/media/library
      - VPN_STATE_FILE=/run/vpn-state/wg0.json
      - COVERS_CACHE_PATH=/config/covers
      - TZ=${TZ:-Europe/Madrid}
      # A6/E6: sin estas dos, lo que el operador pone en el .env NO llega al
      # contenedor (que no monta el .env). ALLOWED_HOSTS no tiene otra vía: no está
      # en Ajustes, y sin él quien entra por un nombre de equipo recibe 403 en todo.
      # La app no puede cambiar su puerto: solo lo lee para avisar si está abierto
      # sin contraseña (/api/health).
      - ZASCARR_BIND_ADDRESS=${ZASCARR_BIND_ADDRESS:-127.0.0.1}
      - BASE_URL=${BASE_URL:-}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      # UID/GID reales del usuario de servicio del host (ZASCARR_USER,
      # resuelto por bootstrap.sh) — sin esto el contenedor corre fijo
      # como UID 1000 y no puede borrar los originales tras importarlos
      # si el usuario de servicio del host tiene otro UID (el caso normal:
      # es un usuario de sistema, Debian no le da el 1000). Ver
      # docker-entrypoint.sh.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
    volumes:
      - ${HOST_DOWNLOADS_DIR:-/media/data/downloads}:/media/downloads
      - ${HOST_AMULE_INCOMING_DIR:-/media/data/aMule/Incoming}:/media/incoming
      - ${HOST_LIBRARY_DIR:-/media/library}:/media/library
      - ${ZASCARR_DATA_DIR:-/var/lib/zascarr}/vpn-state:/run/vpn-state:ro
      - ${ZASCARR_DATA_DIR:-/var/lib/zascarr}/covers:/config/covers
    depends_on:
      credenciales:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
