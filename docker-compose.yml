# docker-compose.yml — Tebeoteca Digital (ZascArr)
#
# Uso:
#   cd /path/a/zascarr   # raíz del repo
#   cp .env.example .env
#   docker compose up -d
#
# La carpeta de datos (config/) vive en el PADRE del repo; los discos del
# usuario (biblioteca/descargas) se pasan por .env (HOST_*_DIR).

name: tebeoteca-arr

networks:
  tebeoteca-internal:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: tebeoteca-db
    restart: unless-stopped
    networks:
      - tebeoteca-internal
    environment:
      POSTGRES_USER: comics_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SuperSecretPassword123}
      POSTGRES_DB: tebeoteca
    command:
      - -c
      - listen_addresses=*
      - -c
      - max_connections=50
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ../config/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comics_admin -d tebeoteca"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: tebeoteca-cache
    restart: unless-stopped
    networks:
      - tebeoteca-internal
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ../config/redis:/data
    deploy:
      resources:
        limits:
          memory: 128M

  zascarr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tebeoteca-orquestador
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tebeoteca-internal
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://comics_admin:${DB_PASSWORD:-SuperSecretPassword123}@postgres:5432/tebeoteca
      - REDIS_URL=redis://redis:6379/0
      - COMICVINE_API_KEY=${COMICVINE_API_KEY:-}
      - PROWLARR_URL=${PROWLARR_URL:-http://host.docker.internal:9696}
      - PROWLARR_API_KEY=${PROWLARR_API_KEY:-}
      - TRANSMISSION_URL=${TRANSMISSION_URL:-http://host.docker.internal:9091}
      - TRANSMISSION_USERNAME=${TRANSMISSION_USERNAME:-}
      - TRANSMISSION_PASSWORD=${TRANSMISSION_PASSWORD:-}
      - AMULE_URL=${AMULE_URL:-http://host.docker.internal:4711}
      - AMULE_PASSWORD=${AMULE_PASSWORD:-}
      - FORUM_ENABLED=${FORUM_ENABLED:-false}
      - FORUM_URL=${FORUM_URL:-}
      - FORUM_USERNAME=${FORUM_USERNAME:-}
      - FORUM_PASSWORD=${FORUM_PASSWORD:-}
      - LIBRARY_PATH=/media/WDElements/Tebeos
      - VPN_STATE_FILE=/run/vpn-state/wg0.json
      - COVERS_CACHE_PATH=/mnt/nvme/tebeoteca/config/covers
      - TZ=${TZ:-Europe/Madrid}
    volumes:
      - ${HOST_DOWNLOADS_DIR:-/media/DiscoDuro/downloads}:/media/DiscoDuro/downloads:ro
      - ${HOST_AMULE_INCOMING_DIR:-/media/DiscoDuro/aMule/Incoming}:/media/DiscoDuro/aMule/Incoming:ro
      - ${HOST_LIBRARY_DIR:-/media/WDElements/Tebeos}:/media/WDElements/Tebeos
      - ../config/vpn-state:/run/vpn-state:ro
      - ../config/covers:/mnt/nvme/tebeoteca/config/covers
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
